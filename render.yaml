services:
  - type: web
    name: medlab-lis
    runtime: node
    plan: free
    branch: feat/full-medlab-lis
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma db push
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medlab-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: MedLab LIS
      - key: NODE_ENV
        value: production

databases:
  - name: medlab-postgres
    plan: free
    databaseName: medlab
    user: medlab
