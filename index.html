24px}.mobilebrand{display:none}.help{font-size:14px;color:var(--muted);margin:12px 0}.chartrow{display:flex;gap:16px;align-items:center;margin:18px 0;font-size:14px}.chartrow span{width:100px}.bar{height:9px;background:#f3e9ed;flex:1;border-radius:4px;overflow:hidden}.bar i{display:block;background:var(--red);height:100%}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}@media(min-width:1500px){.columns{grid-template-columns:minmax(0,1fr) 350px}}@media(max-width:1100px){aside{width:205px}main{margin-left:205px}.workspace{padding:24px}.columns{grid-template-columns:1fr}.stats{gap:12px}.stat{padding:16px}header{padding:0 24px}}@media(max-width:750px){aside{position:static;width:auto;padding:15px 16px;border-bottom:1px solid var(--line)}.brand{padding:0 0 12px;font-size:20px}.logo{width:36px;height:36px}.brand small{font-size:10px}nav{display:flex;overflow:auto}nav button{width:auto;flex-shrink:0;padding:9px 12px;font-size:14px}nav svg,.navlabel,.sidebottom{display:none}main{margin:0}header{height:58px;padding:0 18px}.account span{display:none}.workspace{padding:20px 16px}.notice{margin-bottom:22px}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat strong{font-size:28px}.pagehead{align-items:flex-start}h1{font-size:26px}.pagehead .btn{white-space:nowrap;padding:10px 12px}.cardhead,.toolbar{padding:16px}th,td{padding:14px 16px}.settingsgrid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}.report{padding:20px}.foot{display:block}.crumb{font-size:12px}}@media print{aside,header,.notice,.pagehead,.foot,.noprint,.toast{display:none!important}main{margin:0}.workspace{padding:0}.report{border:0;padding:0}body{background:white}th,td{white-space:normal}.tablewrap{overflow:visible}}

</style></head><body><aside><div class="brand"><div class="logo">+</div><div>KNOX<small>DIAGNOSTICS</small></div></div><div class="navlabel">LAB WORKSPACE</div><nav id="nav"></nav><div class="sidebottom"><b>Laboratory workspace</b><div class="muted">Demonstration edition</div></div></aside><main><header><div class="crumb">Workspace <span style="margin:0 10px;color:#c1c4ce">/</span><span id="crumb">Overview</span></div><div class="account"><span id="today"></span><div class="avatar" aria-label="Knox Diagnostics">KD</div></div></header><div class="workspace"><div class="notice">Demo workspace · Data stays in this browser. Use fictional patients only. Staff accounts and secure shared storage are not connected.</div><div id="app"></div><footer class="foot"><span>Knox Diagnostics · Laboratory management</span><span>Browser workspace / v1.1</span></footer></div></main><dialog id="modal"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button></div><form id="form"></form></dialog><div id="toast" class="toast" role="status" hidden></div><script>
'use strict';
const KEY='knox-diagnostics-v1',pages=['Overview','Patients','Orders','Results','Quality control','Analyzers','Reports','Settings'];
const paths=['M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z','M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M17 4a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-4','M8 3h8v4H8z M8 5H4v16h16V5h-4 M8 12h8 M8 16h6','M4 4h16v16H4z M8 12l3 3 5-6','M3 12h4l3-8 4 16 3-8h4','M3 4h18v13H3z M7 21h10 M12 17v4','M5 3h10l4 4v14H5z M9 11h6 M9 15h6','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3'];
let db={patients:[],orders:[],qc:[],analyzers:[],activity:[]},page='Overview',query='',filter='All',reportId=null;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&['patients','orders','qc','analyzers','activity'].every(k=>Array.isArray(s[k])))db=s}catch(e){}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'-'+crypto.randomUUID().slice(0,8).toUpperCase();const date=v=>new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});const patient=id=>db.patients.find(p=>p.id===id);const status=o=>o.reviewed?'Reviewed':o.result?'Draft':o.received?'Received':'Awaiting sample';
function notify(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(window.to);window.to=setTimeout(()=>el.hidden=true,4000)}
function save(message){try{localStorage.setItem(KEY,JSON.stringify(db));notify(message);return true}catch(e){notify('Could not save in this browser. Export a backup before closing.');return false}}
function log(text){db.activity.unshift({text,time:new Date().toISOString()});db.activity=db.activity.slice(0,20)}
function badge(s){return '<span class="badge '+(s==='Reviewed'?'reviewed':s==='Draft'?'draft':s==='Received'?'received':'')+'">'+esc(s)+'</span>'}
function btn(text,action,primary=false){return '<button class="btn '+(primary?'primary':'small')+'" onclick="'+action+'">'+text+'</button>'}
function head(title,sub,action=''){return '<div class="pagehead"><div><h1>'+title+'</h1><p class="subtitle">'+sub+'</p></div>'+action+'</div>'}
function table(headers,rows,empty='No records yet.'){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'+(!rows.length?'<div class="empty">'+empty+'</div>':'')+'</div>'}
function navTo(p){page=p;query='';filter='All';reportId=null;location.hash=encodeURIComponent(p);render()}
function matches(text){return String(text).toLowerCase().includes(query.toLowerCase())}
function toolbar(placeholder,statuses=[]){return '<div class="toolbar"><input aria-label="'+placeholder+'" placeholder="'+placeholder+'" value="'+esc(query)+'" oninput="searchRows(this.value)">'+(statuses.length?'<select aria-label="Filter status" onchange="filter=this.value;renderList()">'+statuses.map(x=>'<option '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select>':'')+'</div>'}
function searchRows(v){query=v;renderList()}function renderList(){document.getElementById('list').innerHTML=listContent()}
function orderRows(items){return items.map(o=>'<tr><td><b>'+esc(patient(o.patient)?.name||'Unknown')+'</b><small>'+esc(o.id)+'</small></td><td>'+esc(o.test)+'<small>'+esc(o.department)+'</small></td><td>'+date(o.created)+'</td><td>'+badge(status(o))+'</td><td>'+(!o.received?btn('Receive',"receive('"+o.id+"')"):btn(o.reviewed?'Report':'Enter result',o.reviewed?"showReport('"+o.id+"')":"resultForm('"+o.id+"')"))+'</td></tr>')}
function listContent(){if(page==='Patients')return table(['Patient','ID','Sex / date of birth','Phone',''],db.patients.filter(p=>matches(p.name+' '+p.id+' '+p.phone)).map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.id)+'</td><td>'+esc(p.sex)+'<small>'+esc(p.dob||'Not recorded')+'</small></td><td>'+esc(p.phone||'—')+'</td><td>'+btn('New order',"orderForm('"+p.id+"')")+'</td></tr>'),'Register a fictional patient to begin.');
if(page==='Orders')return table(['Patient / accession','Test','Created','Status','Action'],orderRows(db.orders.filter(o=>matches((patient(o.patient)?.name||'')+' '+o.id+' '+o.test)&&(filter==='All'||status(o)===filter))));
if(page==='Results'||page==='Reports')return table(['Patient / accession','Test','Result','Status','Action'],db.orders.filter(o=>(page==='Reports'?o.reviewed:o.received)&&matches((patient(o.patient)?.name||'')+' '+o.id+' '+o.test)).map(o=>'<tr><td><b>'+esc(patient(o.patient)?.name)+'</b><small>'+esc(o.id)+'</small></td><td>'+esc(o.test)+'</td><td>'+esc(o.result||'Not entered')+' '+esc(o.unit||'')+'</td><td>'+badge(status(o))+'</td><td>'+btn(page==='Reports'?'View report':o.reviewed?'View report':'Enter / review',o.reviewed?"showReport('"+o.id+"')":"resultForm('"+o.id+"')")+'</td></tr>'),page==='Reports'?'Reviewed demo results will appear here.':'Receive a sample from Orders to enter results.');return ''}
function overview(){const pending=db.orders.filter(o=>!o.reviewed),draft=db.orders.filter(o=>o.result&&!o.reviewed),reviewed=db.orders.filter(o=>o.reviewed);return head('Laboratory overview','A clear view of your laboratory workflow.',btn('＋ New order','orderForm()',true))+'<div class="stats">'+[['Registered patients',db.patients.length,'In this workspace'],['Open orders',pending.length,'Awaiting completion'],['Awaiting review',draft.length,'Draft results'],['Reviewed results',reviewed.length,'Ready for demo reports']].map(s=>'<div class="card stat"><div class="statlabel">'+s[0]+'</div><strong>'+s[1]+'</strong><small>'+s[2]+'</small></div>').join('')+'</div><div class="columns"><div><section class="card"><div class="cardhead"><div><h2>Recent orders</h2><p class="subtitle">Latest requests across all benches</p></div>'+btn('View all',"navTo('Orders')")+'</div>'+table(['Patient / accession','Test','Created','Status','Action'],orderRows(db.orders.slice(0,6)),'Your worklist is empty. Register a patient, then create an order.')+'</section><section class="card spacer"><div class="cardhead"><h2>Workload by bench</h2><span class="subtitle">All orders</span></div><div class="padded">'+[...new Set(db.orders.map(o=>o.department))].sort().map(d=>{let n=db.orders.filter(o=>o.department===d).length;return '<div class="chartrow"><span>'+d+'</span><div class="bar"><i style="width:'+n/Math.max(1,db.orders.length)*100+'%"></i></div><b>'+n+'</b></div>'}).join('')+'</div></section></div><div><section class="card"><div class="cardhead"><h2>Work queue</h2></div>'+[['Awaiting sample',db.orders.filter(o=>!o.received).length],['At the bench',db.orders.filter(o=>o.received&&!o.result).length],['Results to review',draft.length]].map(x=>'<div class="queue"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</section><section class="card spacer"><div class="cardhead"><h2>Recent activity</h2></div><div class="padded">'+(db.activity.slice(0,4).map(a=>'<div class="activity">'+esc(a.text)+'<small>'+date(a.time)+'</small></div>').join('')||'<p class="subtitle">Actions you take will appear here.</p>')+'</div></section><div class="padded"><p class="help">Exploring for the first time?</p>'+btn('Load fictional demo data','demo()')+'</div></div></div>'}
function render(){document.getElementById('crumb').textContent=page;document.getElementById('nav').innerHTML=pages.map((p,i)=>'<button class="'+(p===page?'active':'')+'" '+(p===page?'aria-current="page"':'')+' onclick="navTo(\''+p+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="'+paths[i]+'"/></svg>'+p+'</button>').join('');let html='';if(page==='Overview')html=overview();else if(['Patients','Orders','Results','Reports'].includes(page)){const info={Patients:['Patients','Patient registration and demographics.','＋ Register patient','patientForm()'],Orders:['Lab orders','Track each request from sample receipt to review.','＋ New order','orderForm()'],Results:['Results','Enter results and record a demo review.','',''],Reports:['Reports','Printable reports for reviewed demo results.','Export CSV','exportOrders()']}[page];html=head(info[0],info[1],info[2]?btn(info[2],info[3],true):'')+'<section class="card">'+toolbar('Search '+page.toLowerCase(),page==='Orders'?['All','Awaiting sample','Received','Draft','Reviewed']:[])+'<div id="list">'+listContent()+'</div></section>'}else if(page==='Quality control')html=head('Quality control','Record control measurements and review notes.',btn('＋ Record QC','qcForm()',true))+'<div class="card">'+table(['Date','Analyte / lot','Analyzer','Level','Value / unit','Notes'],db.qc.map(q=>'<tr><td>'+date(q.created)+'</td><td><b>'+esc(q.analyte)+'</b><small>'+esc(q.lot)+'</small></td><td>'+esc(q.analyzer)+'</td><td>'+esc(q.level)+'</td><td>'+esc(q.value)+' '+esc(q.unit)+'</td><td>'+esc(q.note||'—')+'</td></tr>'),'No QC measurements recorded.')+'</div><p class="help">QC log only. No automatic Westgard assessment or run-release decision is performed.</p>';else if(page==='Analyzers')html=head('Analyzers','Maintain your instrument register.',btn('＋ Add analyzer','analyzerForm()',true))+'<div class="card">'+table(['Instrument','Department','Interface','Connection'],db.analyzers.map(a=>'<tr><td><b>'+esc(a.name)+'</b><small>'+esc(a.serial)+'</small></td><td>'+esc(a.department)+'</td><td>'+esc(a.protocol)+'</td><td>'+badge('Not connected')+'</td></tr>'),'No analyzers registered.')+'</div><p class="help">Instrument registration does not connect hardware. HL7 / ASTM communication requires a server-side interface.</p>';else html=head('Workspace settings','Data and access information.')+'<div class="settingsgrid"><section class="card padded"><h2>Local data</h2><p class="help">Records are saved only in this browser. Export a backup to retain your demonstration records.</p>'+btn('Export backup','backup()',true)+'</section><section class="card padded"><h2>Staff access</h2><p class="help">Staff login, roles, a shared database, and tamper-resistant audit records are not configured in this edition.</p><span class="badge">Demo edition</span></section></div>';document.getElementById('app').innerHTML=html}
function field(name,label,type='text',required=true,value=''){return '<label>'+label+'<input name="'+name+'" type="'+type+'" '+(required?'required':'')+' value="'+esc(value)+'" '+(type==='number'?'step="any"':'maxlength="200"')+'></label>'}
function select(name,label,values){return '<label>'+label+'<select name="'+name+'" required>'+values.map(v=>'<option value="'+esc(Array.isArray(v)?v[0]:v)+'">'+esc(Array.isArray(v)?v[1]:v)+'</option>').join('')+'</select></label>'}
function modal(title,fields,onSubmit,label='Save'){document.getElementById('modalTitle').textContent=title;let f=document.getElementById('form');f.innerHTML='<div class="fields">'+fields+'</div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">'+label+'</button></div>';f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));for(const k in v)v[k]=v[k].trim();if(!onSubmit(v))return;closeModal();render()};document.getElementById('modal').showModal()}
function closeModal(){document.getElementById('modal').close()}
function patientForm(){modal('Register a fictional patient',field('name','Full name')+select('sex','Sex',['Female','Male','Other','Not recorded'])+field('dob','Date of birth','date',false)+field('phone','Phone','tel',false),v=>{if(!v.name){notify('Enter a name.');return false}if(v.dob&&v.dob>new Date().toISOString().slice(0,10)){notify('Date of birth cannot be in the future.');return false}db.patients.unshift({...v,id:uid('P')});log('Patient registered: '+v.name);save('Patient registered');return true})}
function orderForm(id){if(!db.patients.length){notify('Register a patient first.');navTo('Patients');patientForm();return}modal('Create lab order',select('patient','Patient',db.patients.map(p=>[p.id,p.name]))+field('test','Test requested')+select('department','Department',['Hematology','Chemistry','Microbiology','Other'])+field('specimen','Specimen type')+select('priority','Priority',['Routine','Urgent']),v=>{if(!v.test||!v.specimen)return false;db.orders.unshift({...v,id:uid('KDX'),created:new Date().toISOString(),received:false,reviewed:false});log('Order created: '+v.test);save('Order created');return true},'Create order');if(id)document.querySelector('[name="patient"]').value=id}
function receive(id){const o=db.orders.find(x=>x.id===id);if(o&&!o.received){o.received=true;log('Sample received: '+o.id);save('Sample marked received');render()}}
function resultForm(id){const o=db.orders.find(x=>x.id===id);if(!o||o.reviewed)return;modal('Result · '+o.test,field('result','Result','text',true,o.result||'')+field('unit','Unit','text',false,o.unit||'')+field('reference','Lab reference interval','text',false,o.reference||'')+field('reviewer','Reviewer name','text',false,o.reviewer||'')+'<label class="full">Comment<textarea name="comment" maxlength="1000">'+esc(o.comment||'')+'</textarea></label>'+select('action','Save as',['Draft','Reviewed'])+'<p class="help full">Reference intervals must come from your validated laboratory method. Reviewed demo reports are not clinical authorization.</p>',v=>{if(!v.result)return false;if(v.action==='Reviewed'&&!v.reviewer){notify('Enter a reviewer name.');return false}Object.assign(o,{result:v.result,unit:v.unit,reference:v.reference,reviewer:v.reviewer,comment:v.comment,reviewed:v.action==='Reviewed',resultAt:new Date().toISOString()});log('Result '+(o.reviewed?'reviewed':'saved')+': '+o.id);save('Result saved');return true})}
function qcForm(){modal('Record QC measurement',field('analyte','Analyte')+field('lot','Control lot')+field('analyzer','Analyzer')+select('level','Control level',['Level 1','Level 2','Level 3'])+field('value','Measured value','number')+field('unit','Unit')+field('note','Review note','text',false),v=>{db.qc.unshift({...v,id:uid('QC'),created:new Date().toISOString()});log('QC recorded: '+v.analyte);save('QC measurement saved');return true})}
function analyzerForm(){modal('Add analyzer',field('name','Instrument name')+field('serial','Serial number','text',false)+select('department','Department',['Chemistry','Hematology','Microbiology','Other'])+select('protocol','Planned interface',['Not specified','HL7','ASTM','Manual']),v=>{db.analyzers.push({...v,id:uid('AN')});log('Analyzer registered: '+v.name);save('Analyzer registered; hardware not connected');return true})}
function showReport(id){navTo('Reports');const o=db.orders.find(x=>x.id===id);if(!o?.reviewed)return;const p=patient(o.patient);document.getElementById('app').innerHTML=head('Laboratory report','Preview and print a demonstration report.',btn('Print report','window.print()',true))+'<article class="report"><div class="reporttop"><div><b>KNOX DIAGNOSTICS</b><div>Laboratory result report</div></div>'+badge('DEMO REPORT')+'</div><div class="details"><div><small>Patient</small><b>'+esc(p.name)+'</b></div><div><small>Accession</small>'+esc(o.id)+'</div><div><small>Patient ID / sex</small>'+esc(p.id)+' / '+esc(p.sex)+'</div><div><small>Created</small>'+date(o.created)+'</div><div><small>Specimen</small>'+esc(o.specimen)+'</div><div><small>Reviewed by</small>'+esc(o.reviewer)+'</div></div>'+table(['Test','Result','Unit','Lab reference interval'],['<tr><td>'+esc(o.test)+'</td><td><b>'+esc(o.result)+'</b></td><td>'+esc(o.unit||'—')+'</td><td>'+esc(o.reference||'Not supplied')+'</td></tr>'])+'<p>'+esc(o.comment||'')+'</p><p class="reportwarning">DEMONSTRATION ONLY — NOT FOR CLINICAL USE</p><p class="help">Reviewer names are entered manually; no authenticated electronic signature is applied.</p></article>'}

const originalListContent=listContent,originalRender=render,originalResultForm=resultForm,originalShowReport=showReport;
listContent=function(){if(page!=='Test catalogue')return originalListContent();return table(['Test / code','Department','Specimen','Format',''],tests().filter(t=>matches(t.name+' '+t.id+' '+t.fields.map(f=>f.name).join(' '))&&(filter==='All'||t.department===filter)).map(t=>'<tr><td><b>'+esc(t.name)+'</b><small>'+esc(t.id)+' · '+t.fields.length+' result field'+(t.fields.length!==1?'s':'')+'</small></td><td>'+esc(t.department)+'</td><td>'+esc(t.specimen)+'</td><td>'+badge(t.format)+'</td><td>'+btn('View / configure',"templateForm('"+t.id+"')")+' '+btn('Order',"orderForm(null,'"+t.id+"')")+'</td></tr>'),'No matching tests. Add a custom template for a test your lab offers.')};
render=function(){originalRender();if(page==='Test catalogue')document.getElementById('app').innerHTML=head('Test catalogue',tests().length+' tests and panels · '+departments().length+' departments',btn('＋ Custom test','customTestForm()',true))+'<section class="card">'+toolbar('Search test, code or analyte',['All',...departments()])+'<div id="list">'+listContent()+'</div></section><div class="card padded spacer"><h2>Template setup</h2><p class="help">A broad starter catalogue, not every laboratory test. Use Custom test for additional services. Units and specimen suggestions must be checked against your local assay. Configure reference intervals for your method and patient group; they are not prefilled. Results and abnormal flags are entered manually.</p><details><summary>Reference resources</summary><p class="help"><a href="https://medlineplus.gov/lab-tests/" target="_blank" rel="noopener">NLM medical test directory</a> · <a href="https://www.who.int/publications/i/item/9789240030787" target="_blank" rel="noopener">WHO semen examination manual</a> · <a href="https://www.eucast.org/bacteria/clinical-breakpoints-and-interpretation/definition-of-s-i-and-r/" target="_blank" rel="noopener">EUCAST susceptibility definitions</a>. These resources do not validate this demo software. No diagnostic or susceptibility interpretation is automated.</p></details></div>'};
const originalCloseModal=closeModal;closeModal=function(){originalCloseModal();document.getElementById('modal').classList.remove('wide')};
document.getElementById('modal').addEventListener('close',()=>document.getElementById('modal').classList.remove('wide'));
function makeWide(){document.getElementById('modal').classList.add('wide')}
function inputAt(name,value='',placeholder=''){return '<input name="'+name+'" value="'+esc(value)+'" placeholder="'+esc(placeholder)+'" maxlength="250" aria-label="'+esc(placeholder||name)+'">'}
function selectAt(name,values,current='',label=''){return '<select name="'+name+'" aria-label="'+esc(label||name)+'">'+values.map(v=>'<option value="'+esc(v)+'" '+(v===current?'selected':'')+'>'+esc(v||'Select…')+'</option>').join('')+'</select>'}
function templateForm(id){const t=testById(id),fs=templateFields(t);modal(t.name+' · template','<p class="help full">Changes apply to new orders. Existing orders retain their original template. References may include age, sex, pregnancy and method qualifications.</p><div class="full result-scroll"><table class="entrytable"><thead><tr><th>Parameter / format</th><th>Unit</th><th>Reference / decision limits</th></tr></thead><tbody>'+fs.map((f,i)=>'<tr><td><b>'+esc(f.name)+'</b><small>'+esc(f.type)+(f.options?' · '+esc(f.options.join(', ')):'')+'</small></td><td>'+inputAt('unit_'+i,f.unit,'Unit for '+f.name)+'</td><td>'+inputAt('ref_'+i,f.reference||'','Reference for '+f.name)+'</td></tr>').join('')+'</tbody></table></div>',v=>{db.testConfig[id]={fields:fs.map((f,i)=>({unit:v['unit_'+i],reference:v['ref_'+i]}))};log('Template configured: '+t.name);return save('Template settings saved')},'Save configuration');makeWide()}
function customTestForm(){modal('Create a custom test',field('name','Test or panel name')+field('department','Department')+field('specimen','Specimen')+select('format','Report format',['Quantitative','Qualitative','Panel','Microscopy','Culture & AST','Semen analysis','Fluid analysis','Narrative','Compatibility'])+'<label class="full">Result fields<textarea name="definition" required rows="7" maxlength="12000" placeholder="Parameter | unit | number\nFinding | | choice | Negative;Positive;Indeterminate\nConclusion | | narrative"></textarea></label><p class="help full">One parameter per line: name | unit | number, text, choice or narrative | choices separated by semicolons. Add reference intervals using View / configure after saving.</p>',v=>{const lines=v.definition.split('\n').filter(l=>l.trim());if(!v.name||!v.department||!v.specimen||!lines.length||lines.length>80){notify('Enter a name, department, specimen and 1–80 result fields.');return false}const fields=[];for(const l of lines){const [name,unit='',type='text',opts='']=l.split('|').map(s=>s.trim());if(!name||!['number','text','choice','narrative'].includes(type)||(type==='choice'&&!opts)){notify('Check the format of each result field.');return false}fields.push({name,unit,type,...(type==='choice'?{options:opts.split(';').map(s=>s.trim()).filter(Boolean)}:{})})}db.customTests.push({id:uid('CUSTOM'),name:v.name,department:v.department,specimen:v.specimen,format:v.format,fields});log('Custom test added: '+v.name);return save('Custom test added')},'Add test');makeWide()}
orderForm=function(id,preselect){if(!db.patients.length){notify('Register a patient first, then select tests.');navTo('Patients');patientForm();return}modal('Create laboratory request',select('patient','Patient',db.patients.map(p=>[p.id,p.name]))+select('priority','Priority',['Routine','Urgent'])+field('clinician','Requesting clinician','text',false)+field('collected','Collection date / time','datetime-local',false)+'<div class="full"><label>Find tests<input id="testSearch" type="search" placeholder="Search test, code or department" oninput="filterTestPicker(this.value)"></label><div class="testpicker">'+tests().map(t=>'<label class="testoption" data-search="'+esc((t.name+' '+t.id+' '+t.department).toLowerCase())+'"><input type="checkbox" name="testIds" value="'+t.id+'" '+(t.id===preselect?'checked':'')+' onchange="countSelectedTests()"><span><b>'+esc(t.name)+'</b><small>'+esc(t.id)+' · '+esc(t.department)+' · '+esc(t.specimen)+'</small></span></label>').join('')+'</div><p class="help" id="selectionCount">'+(preselect?1:0)+' tests selected</p></div><label class="full">Request / specimen notes<textarea name="requestNote" maxlength="1000" placeholder="Sample IDs, collection details or requested protocol"></textarea></label>',v=>{const ids=new FormData(document.getElementById('form')).getAll('testIds');if(!ids.length){notify('Select at least one test.');return false}const requestId=uid('REQ');ids.forEach(testId=>{const t=testById(testId);db.orders.unshift({id:uid('KDX'),requestId,patient:v.patient,priority:v.priority,clinician:v.clinician,collected:v.collected,requestNote:v.requestNote,testId,test:t.name,department:t.department,specimen:t.specimen,template:snapshot(t),created:new Date().toISOString(),received:false,reviewed:false})});log(ids.length+' test(s) ordered · '+requestId);return save('Created '+ids.length+' laboratory order(s)')},'Create selected orders');makeWide();if(id)document.querySelector('[name="patient"]').value=id};
function filterTestPicker(q){document.querySelectorAll('.testoption').forEach(e=>{e.hidden=!e.dataset.search.includes(q.toLowerCase())})}
function countSelectedTests(){document.getElementById('selectionCount').textContent=document.querySelectorAll('[name="testIds"]:checked').length+' tests selected'}
function resultInput(f,i,value){if(f.type==='choice')return selectAt('v_'+i,['',...f.options],value,f.name);if(f.type==='narrative')return '<textarea name="v_'+i+'" rows="3" maxlength="6000" aria-label="'+esc(f.name)+'">'+esc(value)+'</textarea>';return '<input name="v_'+i+'" value="'+esc(value)+'" maxlength="300" '+(f.type==='number'?'inputmode="decimal"':'')+' aria-label="'+esc(f.name)+'" placeholder="'+(f.type==='number'?'Value or < / > limit':'Enter result')+'">'}
function resultEntryRows(o){return o.template.fields.map((f,i)=>{const r=o.resultRows?.[i]||{};return '<tr><td><b>'+esc(f.name)+'</b><small>'+esc(f.type)+'</small></td><td>'+resultInput(f,i,r.value||'')+selectAt('state_'+i,['Result','Not performed','Not applicable'],r.state||'Result','Reporting status for '+f.name)+'</td><td>'+inputAt('unit_'+i,r.unit??f.unit,'Unit for '+f.name)+'</td><td>'+inputAt('ref_'+i,r.reference??f.reference??'','Reference for '+f.name)+'</td><td>'+selectAt('flag_'+i,['','Normal','Low','High','Abnormal','Critical'],r.flag||'','Manual flag for '+f.name)+'</td></tr>'}).join('')}
let astIndex=0;
function astRow(row={}){const i=astIndex++;return '<div class="astrow" data-ast="'+i+'">'+inputAt('isolate_'+i,row.isolate||'','Isolate / organism')+inputAt('agent_'+i,row.agent||'','Antibiotic')+inputAt('mic_'+i,row.mic||'','MIC (mg/L)')+inputAt('zone_'+i,row.zone||'','Zone (mm)')+selectAt('ast_'+i,['','S','I','R','Not interpreted'],row.interpretation||'','Susceptibility category')+'<button type="button" class="btn small" aria-label="Remove susceptibility row" onclick="this.parentElement.remove()">Remove</button></div>'}
function addAstRow(){document.getElementById('astRows').insertAdjacentHTML('beforeend',astRow())}
function astLegend(){const standard=document.querySelector('[name="astStandard"]').value;document.getElementById('astLegend').textContent=standard==='EUCAST'?'EUCAST: S = susceptible, standard dosing regimen; I = susceptible, increased exposure; R = resistant. Interpret manually using your validated current breakpoint table.':'Record the adopted standard and version. Categories must follow that standard; no breakpoint interpretation is performed here.'}
function readResultRows(o,v){const rows=o.template.fields.map((f,i)=>({name:f.name,type:f.type,value:v['v_'+i]||'',state:v['state_'+i]||'Result',unit:v['unit_'+i]||'',reference:v['ref_'+i]||'',flag:v['flag_'+i]||''}));for(const r of rows){if(r.state!=='Result'){r.value='';r.flag=''}if(r.type==='number'&&r.value&&!/^(?:[<>]=?|[≤≥])?\s*-?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(r.value))throw Error('Enter a numeric value or a < / > detection limit for '+r.name);if(v.action==='Reviewed'&&r.state==='Result'&&!r.value)throw Error('Complete '+r.name+' or mark it Not performed / Not applicable.')}return rows}
resultForm=function(id){const o=db.orders.find(x=>x.id===id);if(!o||o.reviewed)return;if(!o.template){originalResultForm(id);return}astIndex=0;const culture=o.template.format==='Culture & AST';modal(o.test+' · results','<div class="full patientstrip"><b>'+esc(patient(o.patient)?.name)+'</b> · '+esc(o.id)+'<br>'+esc(o.specimen)+'</div>'+field('specimen','Actual specimen / site','text',true,o.specimen)+field('method','Method / instrument','text',false,o.method||'')+'<div class="full result-scroll"><table class="entrytable"><thead><tr><th>Parameter</th><th>Result / status</th><th>Unit</th><th>Reference</th><th>Manual flag</th></tr></thead><tbody>'+resultEntryRows(o)+'</tbody></table></div>'+(culture?'<section class="full"><h3>Antimicrobial susceptibility</h3><p class="help">Add tested agents only. Match each row to its isolate; record MIC and/or zone when available.</p><div class="fields">'+select('astStandard','Interpretation standard',['Not specified','EUCAST','CLSI','Other'])+field('astVersion','Standard version / year','text',false,o.astVersion||'')+'</div><p id="astLegend" class="help"></p><div id="astRows">'+(o.astRows||[]).map(astRow).join('')+'</div><button type="button" class="btn" onclick="addAstRow()">＋ Add antibiotic result</button></section>':'')+field('reviewer','Reviewer name','text',false,o.reviewer||'')+select('action','Save as',['Draft','Reviewed'])+'<label class="full">Report comments / interpretation<textarea name="comment" rows="3" maxlength="6000">'+esc(o.comment||'')+'</textarea></label><p class="help full">Drafts may be incomplete. To mark reviewed, fill every field or mark it Not performed / Not applicable. Units, references and flags are manual. This remains a demonstration report.</p>',v=>{try{const rows=readResultRows(o,v);if(v.action==='Reviewed'&&!v.reviewer)throw Error('Enter a reviewer name.');if(!rows.some(r=>r.value||r.state!=='Result'))throw Error('Enter a result or reporting status before saving.');const ast=[];if(culture)document.querySelectorAll('[data-ast]').forEach(e=>{const i=e.dataset.ast;const r={isolate:v['isolate_'+i],agent:v['agent_'+i],mic:v['mic_'+i],zone:v['zone_'+i],interpretation:v['ast_'+i]};if(!Object.values(r).some(Boolean))return;if(!r.isolate||!r.agent)throw Error('Each antibiotic row needs an isolate and an antibiotic.');if(v.action==='Reviewed'&&!r.interpretation)throw Error('Choose a susceptibility category or Not interpreted.');for(const k of ['mic','zone']){if(r[k]&&!/^(?:[<>]=?|[≤≥])?\s*(?:\d+(?:\.\d*)?|\.\d+)$/.test(r[k]))throw Error('Enter a non-negative MIC or zone value, optionally with < / >.')}ast.push(r)});if(v.action==='Reviewed'&&ast.some(r=>['S','I','R'].includes(r.interpretation))&&(v.astStandard==='Not specified'||!v.astVersion))throw Error('Record the susceptibility standard and version.');const done=rows.filter(r=>r.value||r.state!=='Result').length;Object.assign(o,{resultRows:rows,result:done+' / '+rows.length+' fields recorded',unit:'',specimen:v.specimen,method:v.method,reviewer:v.reviewer,reviewed:v.action==='Reviewed',comment:v.comment,resultAt:new Date().toISOString(),astRows:ast,astStandard:v.astStandard||'',astVersion:v.astVersion||''});log('Structured result '+(o.reviewed?'reviewed':'saved')+': '+o.id);return save('Results saved')}catch(e){notify(e.message);return false}},'Save results');makeWide();if(culture){document.querySelector('[name="astStandard"]').value=o.astStandard||'Not specified';document.querySelector('[name="astStandard"]').onchange=astLegend;astLegend()}};
showReport=function(id){const o=db.orders.find(x=>x.id===id);if(!o?.resultRows){originalShowReport(id);return}if(!o.reviewed)return;navTo('Reports');const p=patient(o.patient);const ast=o.astRows?.length?'<h3 class="spacer">Culture susceptibility</h3><p class="help">Standard: '+esc(o.astStandard)+' · '+esc(o.astVersion)+'</p>'+table(['Isolate','Agent','MIC (mg/L)','Zone (mm)','Category'],o.astRows.map(r=>'<tr>'+[r.isolate,r.agent,r.mic||'—',r.zone||'—',r.interpretation||'Not interpreted'].map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>'))+'<p class="help">'+(o.astStandard==='EUCAST'?'S: susceptible, standard dosing regimen. I: susceptible, increased exposure. R: resistant.':'Interpretation categories follow the recorded standard.')+'</p>':'';document.getElementById('app').innerHTML=head('Laboratory report',esc(o.test),btn('Print / Save PDF','window.print()',true))+'<article class="report structured"><div class="reporttop"><div><b>KNOX DIAGNOSTICS</b><div>'+esc(o.department)+' · '+esc(o.test)+'</div></div>'+badge('DEMO REPORT')+'</div><div class="details"><div><small>Patient / ID</small><b>'+esc(p?.name)+'</b> · '+esc(p?.id)+'</div><div><small>Accession / request</small>'+esc(o.id)+' / '+esc(o.requestId||'—')+'</div><div><small>Date of birth / sex</small>'+esc(p?.dob||'Not recorded')+' / '+esc(p?.sex)+'</div><div><small>Specimen</small>'+esc(o.specimen)+'</div><div><small>Collected (as entered)</small>'+esc(o.collected?.replace('T',' ')||'Not recorded')+'</div><div><small>Reported</small>'+date(o.resultAt)+'</div><div><small>Requesting clinician</small>'+esc(o.clinician||'Not recorded')+'</div><div><small>Method / instrument</small>'+esc(o.method||'Not recorded')+'</div></div>'+table(['Parameter','Result','Unit','Reference / limits','Flag'],o.resultRows.map(r=>'<tr><td>'+esc(r.name)+'</td><td class="resultvalue">'+esc(r.state==='Result'?r.value:r.state)+'</td><td>'+esc(r.state==='Result'?r.unit:'—')+'</td><td>'+esc(r.reference||'Not configured')+'</td><td>'+esc(r.flag||'—')+'</td></tr>'))+ast+(o.requestNote?'<p class="help">Request notes: '+esc(o.requestNote)+'</p>':'')+(o.comment?'<h3 class="spacer">Comments</h3><p class="prewrap">'+esc(o.comment)+'</p>':'')+'<p class="help">Reviewed by: '+esc(o.reviewer)+' · Flags entered manually.</p><p class="reportwarning">DEMONSTRATION ONLY — NOT FOR CLINICAL USE</p><p class="help">Reviewer names are entered manually; no authenticated electronic signature is applied.</p></article>'};
exportOrders=function(){const data=[['Accession','Patient','Test','Parameter','Result','Unit','Reference','Flag','Status']];db.orders.filter(o=>o.reviewed).forEach(o=>{if(o.resultRows)o.resultRows.forEach(r=>data.push([o.id,patient(o.patient)?.name,o.test,r.name,r.state==='Result'?r.value:r.state,r.unit,r.reference,r.flag,status(o)]));else data.push([o.id,patient(o.patient)?.name,o.test,o.test,o.result,o.unit,o.reference||'','',status(o)]);(o.astRows||[]).forEach(r=>data.push([o.id,patient(o.patient)?.name,o.test,r.isolate+' / '+r.agent,r.interpretation,'',o.astStandard+' '+o.astVersion+'; MIC='+r.mic+' mg/L; Zone='+r.zone+' mm','',status(o)]))});download('knox-structured-results.csv',data.map(r=>r.map(csv).join(',')).join('\r\n'),'text/csv;charset=utf-8')};

function attachDemoTemplates(){for(const o of db.orders){if(o.template||o.result||o.reviewed)continue;const map={'DEMO-KDX-01':'HB','DEMO-KDX-02':'RBS'};const t=testById(map[o.id]);if(t){o.testId=t.id;o.template=snapshot(t)}}}
const originalDemo=demo;demo=function(){originalDemo();attachDemoTemplates();save('Fictional demo records ready');render()};attachDemoTemplates();
document.getElementById('today').textContent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});window.addEventListener('hashchange',()=>{let p;try{p=decodeURIComponent(location.hash.slice(1))}catch(e){p='Overview'}if(pages.includes(p)&&p!==page){page=p;query='';filter='All';render()}});try{const initial=decodeURIComponent(location.hash.slice(1));if(pages.includes(initial))page=initial}catch(e){}render();
</script></body></html>
