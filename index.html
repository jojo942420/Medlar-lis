<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLab LIS</title><style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#172033;--muted:#667085;--line:#e6eaf0;--blue:#155eef;--nav:#0b1730;--green:#12b76a;--amber:#f79009;--red:#f04438;--teal:#0e9384}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:245px;background:var(--nav);color:#cbd5e5;padding:20px 14px}.brand{display:flex;gap:10px;align-items:center;color:#fff;font-size:20px;font-weight:800;padding:5px 10px 25px}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#14b8a6);display:grid;place-items:center}.label{font-size:10px;letter-spacing:.12em;color:#7183a3;margin:14px 10px 7px;text-transform:uppercase}.nav{padding:10px 12px;border-radius:9px;cursor:pointer;margin:2px 0;display:flex;gap:11px;align-items:center;color:#b9c5d8}.nav:hover,.nav.active{background:#17294a;color:#fff}.sideuser{position:absolute;bottom:16px;left:14px;right:14px;border-top:1px solid #1d2d4b;padding:13px 10px;display:flex;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#155eef;font-weight:800}.main{margin-left:245px}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:3}.search{width:380px;background:#f5f7fa;border:1px solid var(--line);padding:10px 13px;border-radius:9px;color:#98a2b3}.page{padding:28px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0;font-size:25px}.head p{margin:5px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:650}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.stat b{font-size:25px;display:block;margin-top:6px}.muted{color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.table{width:100%;border-collapse:collapse;margin-top:15px;font-size:12px}.table th{text-align:left;color:#8b96a8;padding:9px 8px;border-bottom:1px solid var(--line)}.table td{padding:12px 8px;border-bottom:1px solid #f0f2f5}.badge{padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700}.ok{background:#ecfdf3;color:#027a48}.wait{background:#fff7e8;color:#b54708}.bad{background:#fef3f2;color:#b42318}.info{background:#eff8ff;color:#175cd3}.toolbar{display:flex;gap:9px;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}.toolbar input{flex:1}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}.queue{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--amber)}.dot.red{background:var(--red)}.dot.green{background:var(--green)}.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{border:1px solid var(--line);border-radius:9px;padding:11px}.field small{display:block;color:#98a2b3;margin-bottom:4px}.result{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--line);border-radius:10px;margin-top:9px}.value{font-size:18px;font-weight:800}.meter{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden;margin-top:8px}.meter span{display:block;height:100%;background:var(--blue)}.empty{padding:45px;text-align:center;color:var(--muted)}@media(max-width:900px){.side{width:70px}.brand span,.nav span,.label,.sideuser div{display:none}.main{margin-left:70px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.side{display:none}.main{margin:0}.page{padding:17px}.top{padding:0 15px}.search{width:190px}.stats{grid-template-columns:1fr}.head{align-items:flex-start;gap:10px}.actions{flex-wrap:wrap}.detail{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">M</div><span>MedLab LIS</span></div><div class="label">Workspace</div><div class="nav active" data-page="Dashboard">▦ <span>Dashboard</span></div><div class="nav" data-page="Patients">♙ <span>Patients</span></div><div class="nav" data-page="Orders">◫ <span>Lab Orders</span></div><div class="nav" data-page="Results">✓ <span>Results</span></div><div class="label">Laboratory</div><div class="nav" data-page="QC">◉ <span>Quality Control</span></div><div class="nav" data-page="Analyzers">▣ <span>Analyzers</span></div><div class="nav" data-page="Reports">▤ <span>Reports</span></div><div class="label">Administration</div><div class="nav" data-page="Users">♧ <span>Users & Roles</span></div><div class="nav" data-page="Settings">⚙ <span>Settings</span></div><div class="sideuser"><div class="avatar">JS</div><div><b style="color:#fff;font-size:12px">Lab Scientist</b><small style="display:block">Administrator</small></div></div></aside><main class="main"><header class="top"><div class="search">⌕ &nbsp; Search patients, orders, results…</div><div style="display:flex;gap:14px;align-items:center"><span class="muted">Accra Central Laboratory</span><div class="avatar">JS</div></div></header><div id="app" class="page"></div></main></div>
<script>
const patients=[['P-100284','Ama Mensah','Female','29','024 555 1042','Active'],['P-100283','Kwame Boateng','Male','41','024 555 2088','Active'],['P-100282','Nana Owusu','Male','56','024 555 3091','Active'],['P-100281','Esi Addo','Female','34','024 555 4118','Active'],['P-100280','Kojo Asante','Male','47','024 555 5220','Active']];
const orders=[['ML-10284','Ama Mensah','CBC · LFT','21 Sep, 09:42','Completed'],['ML-10283','Kwame Boateng','FBC · Malaria','21 Sep, 09:35','Processing'],['ML-10282','Nana Owusu','HbA1c · RBS','21 Sep, 09:12','Critical'],['ML-10281','Esi Addo','Urinalysis','21 Sep, 08:58','Completed'],['ML-10280','Kojo Asante','Lipid profile','21 Sep, 08:43','Pending']];
function badge(s){let c=s==='Completed'||s==='Active'?'ok':s==='Critical'?'bad':s==='Processing'||s==='Pending'?'wait':'info';return '<span class="badge '+c+'">'+s+'</span>'}
function layout(title,sub,actions=''){return '<div class="head"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+actions+'</div></div>'}
function dashboard(){return layout('Laboratory dashboard','21 September 2026 · Real-time workflow overview','<button class="btn primary" onclick="page(\'Orders\')">＋ New order</button>')+'<div class="stats"><div class="card"><span class="muted">Patients today</span><b>128</b><span class="muted">↑ 12.4% vs yesterday</span></div><div class="card"><span class="muted">Pending tests</span><b>37</b><span class="muted">14 awaiting validation</span></div><div class="card"><span class="muted">Results released</span><b>91</b><span class="muted">↑ 8.1% today</span></div><div class="card"><span class="muted">Critical results</span><b style="color:var(--red)">4</b><span class="muted">Requires attention</span></div></div><div class="grid2"><div class="card"><h3>Recent laboratory orders</h3><span class="muted">Latest requests across all benches</span>'+orderTable()+'</div><div class="card"><h3>Work queue</h3><span class="muted">Items needing action</span><div class="queue"><span><i class="dot red"></i>4 critical results</span><b style="color:var(--red)">Urgent</b></div><div class="queue"><span><i class="dot"></i>14 results awaiting validation</span><b style="color:var(--amber)">Review</b></div><div class="queue"><span><i class="dot green"></i>3 analyzer alerts</span><b style="color:var(--green)">Open</b></div></div></div>'}
function orderTable(){return '<table class="table"><thead><tr><th>Patient</th><th>Order</th><th>Tests</th><th>Status</th></tr></thead><tbody>'+orders.map(o=>'<tr><td><b>'+o[1]+'</b></td><td>'+o[0]+'</td><td>'+o[2]+'</td><td>'+badge(o[4])+'</td></tr>').join('')+'</tbody></table>'}
function patientsPage(){return layout('Patients','Patient registration, demographics and clinical history','<button class="btn primary">＋ Register patient</button>')+'<div class="card"><div class="toolbar"><input placeholder="Search by patient name, ID or phone"><select><option>All patients</option><option>Active</option></select></div><table class="table"><thead><tr><th>Patient ID</th><th>Name</th><th>Sex</th><th>Age</th><th>Phone</th><th>Status</th><th></th></tr></thead><tbody>'+patients.map(p=>'<tr><td>'+p[0]+'</td><td><b>'+p[1]+'</b></td><td>'+p[2]+'</td><td>'+p[3]+'</td><td>'+p[4]+'</td><td>'+badge(p[5])+'</td><td><button class="btn" onclick="patientDetail(\''+p[0]+'\')">View</button></td></tr>').join('')+'</tbody></table></div>'}
function patientDetail(id){let p=patients.find(x=>x[0]===id);document.getElementById('app').innerHTML=layout('Patient profile','Patient ID '+p[0],'<button class="btn primary">＋ New order</button>')+'<div class="card"><div class="detail"><div class="field"><small>Full name</small><b>'+p[1]+'</b></div><div class="field"><small>Patient ID</small><b>'+p[0]+'</b></div><div class="field"><small>Sex / Age</small><b>'+p[2]+' · '+p[3]+' years</b></div><div class="field"><small>Phone</small><b>'+p[4]+'</b></div></div></div><div class="card" style="margin-top:15px"><h3>Laboratory history</h3>'+orderTable()+'</div>'}
function ordersPage(){return layout('Lab Orders','Create, track and manage laboratory requests','<button class="btn primary">＋ Create lab order</button>')+'<div class="kpis"><div class="card"><span class="muted">Today</span><b>86 orders</b></div><div class="card"><span class="muted">Processing</span><b>37</b></div><div class="card"><span class="muted">Completed</span><b>49</b></div></div><div class="card"><div class="toolbar"><input placeholder="Search order or patient"><select><option>All statuses</option><option>Pending</option><option>Processing</option><option>Completed</option></select><select><option>All benches</option><option>Hematology</option><option>Chemistry</option><option>Microbiology</option></select></div>'+orderTable()+'</div>'}
function resultsPage(){return layout('Results','Review, validate and release laboratory results','<button class="btn">Filter critical</button><button class="btn primary">Validate selected</button>')+'<div class="card"><div class="toolbar"><input placeholder="Search result, patient or accession number"><select><option>Awaiting validation</option><option>All results</option><option>Released</option></select></div><table class="table"><thead><tr><th>Accession</th><th>Patient</th><th>Test</th><th>Result</th><th>Reference</th><th>Status</th><th></th></tr></thead><tbody><tr><td>ML-10282</td><td><b>Nana Owusu</b></td><td>Glucose</td><td class="value" style="color:var(--red)">18.4 mmol/L</td><td>3.9–7.8</td><td>'+badge('Critical')+'</td><td><button class="btn">Review</button></td></tr><tr><td>ML-10283</td><td><b>Kwame Boateng</b></td><td>Malaria RDT</td><td>Positive</td><td>Negative</td><td>'+badge('Pending')+'</td><td><button class="btn">Validate</button></td></tr><tr><td>ML-10284</td><td><b>Ama Mensah</b></td><td>WBC</td><td>6.8 ×10⁹/L</td><td>4.0–11.0</td><td>'+badge('Completed')+'</td><td><button class="btn">View</button></td></tr></tbody></table></div>'}
function qcPage(){return layout('Quality Control','Monitor internal QC, Westgard flags and lot performance','<button class="btn primary">＋ Record QC run</button>')+'<div class="stats"><div class="card"><span class="muted">QC runs today</span><b>24</b><span class="muted">All benches</span></div><div class="card"><span class="muted">In control</span><b style="color:var(--green)">22</b><span class="muted">91.7%</span></div><div class="card"><span class="muted">Flags</span><b style="color:var(--amber)">2</b><span class="muted">Review required</span></div><div class="card"><span class="muted">Active lots</span><b>17</b><span class="muted">Across analyzers</span></div></div><div class="grid2"><div class="card"><h3>QC Levey-Jennings</h3><span class="muted">Chemistry · Glucose Level 2</span><div style="height:190px;margin-top:18px;border-bottom:1px solid var(--line);border-top:1px dashed #d0d5dd;position:relative"><div style="position:absolute;top:50%;left:0;right:0;border-top:1px dashed #98a2b3"></div><div style="position:absolute;top:20%;left:0;right:0;border-top:1px dashed #d0d5dd"></div><div style="position:absolute;bottom:20%;left:0;right:0;border-top:1px dashed #d0d5dd"></div><div style="position:absolute;left:4%;right:4%;bottom:44%;height:3px;background:var(--blue);transform:rotate(-3deg);box-shadow:40px 4px 0 var(--blue),80px -2px 0 var(--blue),120px 5px 0 var(--blue),160px -1px 0 var(--blue),200px 3px 0 var(--blue),240px -5px 0 var(--blue),280px 1px 0 var(--blue)"></div></div><div class="muted" style="display:flex;justify-content:space-between;margin-top:8px"><span>-2SD</span><span>Mean</span><span>+2SD</span></div></div><div class="card"><h3>QC alerts</h3><div class="queue"><span><i class="dot red"></i>Glucose L2 · Rule 1-3s</span><b>Open</b></div><div class="queue"><span><i class="dot"></i>ALT L1 · Rule 2-2s</span><b>Review</b></div><div class="queue"><span><i class="dot green"></i>All other controls</span><b>In control</b></div></div></div>'}
function analyzersPage(){return layout('Analyzers','Instrument status, connectivity and result interfaces','<button class="btn primary">＋ Add analyzer</button>')+'<div class="stats"><div class="card"><span class="muted">Connected</span><b style="color:var(--green)">4</b><span class="muted">Online</span></div><div class="card"><span class="muted">Warnings</span><b style="color:var(--amber)">2</b><span class="muted">Attention needed</span></div><div class="card"><span class="muted">Offline</span><b>1</b><span class="muted">Last seen 12m ago</span></div><div class="card"><span class="muted">Results received</span><b>312</b><span class="muted">Today</span></div></div><div class="card"><table class="table"><thead><tr><th>Analyzer</th><th>Department</th><th>Interface</th><th>Last communication</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr><td><b>Sysmex XN-1000</b></td><td>Hematology</td><td>HL7 / ASTM</td><td>Just now</td><td>'+badge('Active')+'</td><td><button class="btn">Monitor</button></td></tr><tr><td><b>Mindray BS-240</b></td><td>Chemistry</td><td>HL7</td><td>2 min ago</td><td>'+badge('Active')+'</td><td><button class="btn">Monitor</button></td></tr><tr><td><b>Abbott Architect</b></td><td>Immunology</td><td>HL7</td><td>5 min ago</td><td>'+badge('Processing')+'</td><td><button class="btn">Monitor</button></td></tr><tr><td><b>Urilyzer 500</b></td><td>Urinalysis</td><td>ASTM</td><td>12 min ago</td><td>'+badge('Pending')+'</td><td><button class="btn">Reconnect</button></td></tr></tbody></table></div>'}
function reportsPage(){return layout('Reports','Generate, review and print laboratory reports','<button class="btn">Export CSV</button><button class="btn primary">＋ Generate report</button>')+'<div class="grid2"><div class="card"><h3>Report builder</h3><div class="detail" style="margin-top:15px"><div class="field"><small>Report type</small><select style="border:0;width:100%"><option>Daily laboratory activity</option><option>Test volume</option><option>Turnaround time</option><option>QC performance</option></select></div><div class="field"><small>Date range</small><b>21 Sep 2026</b></div><div class="field"><small>Department</small><b>All departments</b></div><div class="field"><small>Format</small><b>PDF</b></div></div><button class="btn primary" style="margin-top:15px">Generate PDF report</button></div><div class="card"><h3>Recent reports</h3><div class="queue"><span>Daily activity · 20 Sep</span><button class="btn">Print</button></div><div class="queue"><span>QC performance · Week 38</span><button class="btn">Print</button></div><div class="queue"><span>Turnaround time · Sep</span><button class="btn">Print</button></div></div></div><div class="card" style="margin-top:16px"><h3>Printable laboratory report preview</h3><div style="border:1px solid var(--line);margin-top:15px;padding:25px;background:#fff"><div style="display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:15px"><div><h2 style="margin:0">MEDLAB LABORATORY</h2><span class="muted">Accra Central Laboratory · Diagnostic Services</span></div><b>LAB REPORT</b></div><div class="detail" style="margin-top:18px"><div><span class="muted">Patient</span><br><b>Ama Mensah</b></div><div><span class="muted">Accession</span><br><b>ML-10284</b></div><div><span class="muted">Collected</span><br><b>21 Sep 2026 · 09:42</b></div><div><span class="muted">Status</span><br>'+badge('Completed')+'</div></div><table class="table"><tr><th>Test</th><th>Result</th><th>Unit</th><th>Reference interval</th></tr><tr><td>CBC · WBC</td><td>6.8</td><td>×10⁹/L</td><td>4.0–11.0</td></tr><tr><td>CBC · Hb</td><td>13.4</td><td>g/dL</td><td>12.0–16.0</td></tr></table><p class="muted">Validated electronically by Laboratory Scientist · FHIR/HL7 workflow enabled</p></div></div>'}
function page(name){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===name));let content=name==='Dashboard'?dashboard():name==='Patients'?patientsPage():name==='Orders'?ordersPage():name==='Results'?resultsPage():name==='QC'?qcPage():name==='Analyzers'?analyzersPage():name==='Reports'?reportsPage():layout(name,'Administration and system configuration')+'<div class="card empty">Module interface ready for configuration.</div>';document.getElementById('app').innerHTML=content}
function patientDetail(id){let p=patients.find(x=>x[0]===id);document.getElementById('app').innerHTML=layout('Patient profile','Patient ID '+p[0],'<button class="btn primary">＋ New order</button>')+'<div class="card"><div class="detail"><div class="field"><small>Full name</small><b>'+p[1]+'</b></div><div class="field"><small>Patient ID</small><b>'+p[0]+'</b></div><div class="field"><small>Sex / Age</small><b>'+p[2]+' · '+p[3]+' years</b></div><div class="field"><small>Phone</small><b>'+p[4]+'</b></div></div></div><div class="card" style="margin-top:15px"><h3>Laboratory history</h3>'+orderTable()+'</div>'}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>page(n.dataset.page));page('Dashboard');
</script></body></html>
